[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "virgo-rng-experimental"
version = "2.0.0"
description = "Experimental radio astronomy SDR entropy research toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
sdr = ["pyrtlsdr==0.3.0", "setuptools==80.9.0"]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]
[project.scripts]
virgo-rng = "virgo_rng.cli:main"
virgo-rng-lab = "virgo_rng.lab20:main"
[tool.setuptools.packages.find]
include = ["virgo_rng*"]

[tool.setuptools.package-data]
virgo_rng = ["web/*.html"]
